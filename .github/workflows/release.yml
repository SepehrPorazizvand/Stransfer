name: Publish release
on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stransfer-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check repository for committed credentials
        shell: pwsh
        run: ./scripts/check-secrets.ps1 -History -SelfTest
      - name: Read version and check published release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.StransferVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.version.outputs.exists != 'true'
        with:
          global-json-file: global.json
      - name: Test, build and package clean portable and setup files
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Verify in-place update and restart with the published executable
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/test-update-lifecycle.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.exists != 'true'
        with:
          name: release-win-x64
          path: dist/releases/v${{ steps.version.outputs.version }}/*
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-win-x64
          path: release
      - name: Publish verified build outputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $expected = @('SHA256SUMS.txt','Stransfer-portable-win-x64.zip','Stransfer-Setup-win-x64.exe','update-win-x64.json')
          $files = @(Get-ChildItem release -File)
          if ($files.Count -ne $expected.Count -or @($files | Where-Object Name -NotIn $expected).Count -ne 0) { throw 'Unexpected release files' }
          $notes = @'
          Download **Stransfer-Setup-win-x64.exe** to install, or extract **Stransfer-portable-win-x64.zip** and run Stransfer.exe.

          - Settings → Updates checks GitHub Releases. Downloads require your permission.
          - After approval, the app verifies the download, saves transfer progress, updates in place and restarts without a setup wizard.
          - Ctrl+Shift+V uses Stransfer. Ctrl+V keeps Windows paste.
          - Settings and saved transfer records are retained during updates.

          Full Windows x64 builds include their runtime. SHA256SUMS.txt and update-win-x64.json support integrity verification and in-app updates.
          '@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Set-Content $notesFile -Encoding utf8NoBOM
          $assets = @($files | ForEach-Object FullName)
          gh release create "v$env:RELEASE_VERSION" @assets --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title "Stransfer $env:RELEASE_VERSION" --notes-file $notesFile --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
