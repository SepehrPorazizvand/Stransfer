name: Publish release
on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stransfer-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read version and check published release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.StransferVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.exists != 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Test, build and package clean portable and setup files
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Verify in-place update and restart with the published executable
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/test-update-lifecycle.ps1
      - name: Publish versioned downloads
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @'
          Download **Stransfer-Setup-win-x64.exe** to install, or extract **Stransfer-portable-win-x64.zip** and run Stransfer.exe.

          - Settings → Updates checks GitHub Releases. Downloads require your permission.
          - After approval, the app verifies the download, saves transfer progress, updates in place and restarts without a setup wizard.
          - Ctrl+Shift+V uses Stransfer. Ctrl+V keeps Windows paste.
          - Settings and saved transfer records are retained during updates.

          Full Windows x64 builds include their runtime. SHA256SUMS.txt and update-win-x64.json support integrity verification and in-app updates.
          '@
          $notes | Set-Content dist/release-notes.md -Encoding utf8NoBOM
          $assets = @(Get-ChildItem "dist/releases/v$env:RELEASE_VERSION" -File | ForEach-Object FullName)
          gh release create "v$env:RELEASE_VERSION" @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Stransfer $env:RELEASE_VERSION" --notes-file dist/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
